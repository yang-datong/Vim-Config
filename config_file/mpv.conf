# --- 基础操作设置 ---
# 播放结束后不退出
keep-open=yes

# 启动时自动全屏 (可选，若不需要请注释掉)
# fs=yes

# 窗口置顶
# ontop=yes

# 隐藏光标时间 (毫秒)
cursor-autohide=1000

# --- 硬件解码与渲染 ---
# macOS -> videotoolbox, Windows -> d3d11va, Linux -> vaapi/vdpau
hwdec=auto-safe
# 使用高性能渲染后端
# gpu-next 是目前的高画质推荐，兼容性极佳
vo=gpu-next
gpu-api=auto
# 开启着色器编译缓存，加速启动
gpu-shader-cache=yes

## --- 超分、锐化与画质增强 (针对 RX 550 + 2K 屏幕优化) ---
# 1. 基础缩放算法 (配合 FSR 处理色度平面与非整数缩放)
scale=ewa_lanczossharp
cscale=lanczos
dscale=mitchell

# 2. 去色带 (Deband)：消除直播低码率带来的色彩断层、暗部色块与马赛克感
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=16

# 3. AMD FidelityFX 超分与对比度自适应锐化 (FSR + RCAS)
# - 窗口大于 720p (1280x720) 时：自动启用 FSR 超分至 2K (2560x1440，小窗下享受 2K 超采样抗锯齿，全屏下 1:1 点对点输出)
# - 窗口小于等于 720p 时：自动启用 RCAS_native (仅执行轻量级对比度自适应锐化与降噪)
glsl-shaders="~~/shaders/FSR.glsl:~~/shaders/RCAS_native.glsl"

## --- HDR 设置 ---
# 开启 HDR 峰值检测
tone-mapping=bt.2446a
# 目标色域自动适配显示器
target-colorspace-hint=yes

# 如果显示器不支持 HDR，mpv 会自动进行高质量的色调映射 (Tone-mapping) 强制开启 HDR 传递（如果你有 HDR 显示器并希望由显示器处理）
# target-trc=pq

## --- 缓存与性能 ---
# 增加缓存，防止网络或 4K 视频卡顿
cache=yes
demuxer-max-bytes=1G
demuxer-max-back-bytes=1G
